<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunucu Odası Akıllı Takip ve Soğutma Sistemi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1422;color:#dce7f5;font-family:'Segoe UI',Arial,sans-serif}
.page{padding:22px;max-width:1500px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:24px}
.card{background:#1b293d;border:1px solid #31435d;border-radius:12px;padding:20px;min-height:205px;box-shadow:0 8px 20px rgba(0,0,0,.20)}
.card-name{color:#9fb0c8;font-size:14px;margin-bottom:8px}
.card-value{font-size:34px;font-weight:700;color:#f2f7fc}
.unit{font-size:15px;color:#b7c4d5;font-weight:400}
.sub{font-size:12px;margin-top:8px;color:#21d89b}
.line{height:5px;background:#0e1726;border-radius:5px;margin-top:18px;overflow:hidden}
.line span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2f80ed,#e74c3c);border-radius:5px;transition:width .5s}
.icon{width:42px;height:42px;border-radius:9px;background:#243754;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:15px}
.blue{color:#3b8cff}.cyan{color:#00c8e8}.green{color:#19d59b}.purple{color:#8a7cff}
.status{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;margin-top:10px}
.dot{width:17px;height:17px;border-radius:50%;display:inline-block;flex-shrink:0}
.normal{background:#63e6a8;box-shadow:0 0 10px #63e6a8}
.critical{background:#ff5c5c;box-shadow:0 0 10px #ff5c5c}
.warning{background:#f1c40f;box-shadow:0 0 10px #f1c40f}
.low{background:#3498db;box-shadow:0 0 10px #3498db}
.section{background:#1b293d;border:1px solid #31435d;border-radius:12px;margin-bottom:14px;overflow:hidden}
.section-title{padding:19px 22px;cursor:pointer;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:#1d2b40}
.section-title:hover{background:#22334b}
.arrow{font-size:20px;color:#6f829d;transition:.2s}.arrow.open{transform:rotate(180deg)}
.section-content{display:none;padding:20px;border-top:1px solid #304158}.section-content.open{display:block}
.chart-box{background:#101b2d;border:1px solid #304158;border-radius:10px;padding:15px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chart-title{font-size:14px;font-weight:700}.live{font-size:11px;color:#21d89b}
canvas{width:100%;height:300px;display:block}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;background:#0e1728;color:#8fa3bd;padding:13px}
.table td{padding:13px;border-bottom:1px solid #304158;color:#d5dfeb}
.badge{padding:4px 9px;border-radius:4px;background:#18345d;color:#5ea0ff;font-size:11px;font-weight:bold}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1b293d;padding:25px;border-radius:12px;width:340px;border:1px solid #31435d;z-index:1000;text-align:center}
.modal-backdrop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999}
input{outline:none}
button{font-family:inherit}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cards{grid-template-columns:1fr}.page{padding:12px}}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>

<div class="page">
<h1 style="text-align:center;color:#f2f7fc;font-size:26px;margin:5px 0 25px">Sunucu Odası Nem ve Sıcaklık Takip Sistemi</h1>

<div class="cards">
<div class="card">
<div class="icon blue">☀️</div>
<div class="card-name">Sıcaklık</div>
<div class="card-value" id="val_sicaklik">-- <span class="unit">°C</span></div>
<div class="sub" id="sub_sicaklik">● Bağlanıyor...</div>
<div class="line"><span id="bar_sicaklik"></span></div>
</div>

<div class="card">
<div class="icon cyan">♨</div>
<div class="card-name">Nem</div>
<div class="card-value" id="val_nem">-- <span class="unit">% RH</span></div>
<div class="sub">İdeal Nem (%40 - %55)</div>
<div class="line"><span id="bar_nem" style="background:#00c8e8"></span></div>
</div>

<div class="card">
<div class="icon green">🚨</div>
<div class="card-name">Alarm Durumu</div>
<div class="status" id="val_alarm">--</div>
</div>

<div class="card">
<div class="icon">彡</div>
<div class="card-name">Havalandırma</div>
<div class="status" id="val_fan">--</div>
</div>
</div>

<div style="margin:20px 0 25px;text-align:center">
<button onclick="openModal()" style="background:#ffc107;color:#333;padding:12px 22px;font-weight:bold;cursor:pointer;border:none;border-radius:6px;min-width:280px">🔐 Şifre Değiştir</button>
</div>

<div id="sifrePencerem" class="modal">
<h3 style="margin-top:0">Yeni Şifre</h3>
<p style="font-size:12px;color:#9fb0c8"></p>
<input type="password" id="yeniSifreMetni" inputmode="numeric" pattern="[0-9]*" placeholder="4 Haneli Şifre" maxlength="4"
style="padding:11px;width:100%;margin-bottom:12px;border-radius:5px;border:1px solid #31435d;background:#101b2d;color:#fff;text-align:center">
<button onclick="sifreGuncelle()" style="background:#28a745;width:100%;color:#fff;font-weight:bold;padding:10px;border:none;border-radius:5px;cursor:pointer;margin-bottom:8px">Şifreyi Güncelle</button>
<button onclick="closeModal()" style="background:#dc3545;width:100%;color:#fff;padding:7px;border:none;border-radius:5px;cursor:pointer">Kapat</button>
</div>

<div class="section">
  <!-- 1. Başlık Alanı -->
  <div class="section-title" onclick="toggleSection('sicaklikBolumu',this.querySelector('.arrow'))">
    <span>⌁ &nbsp; Sıcaklık Grafiği (°C)</span><span class="arrow" id="arrow_sicaklik">▼</span>
  </div>
  
  <!-- 2. İçerik Alanı -->
  <div id="sicaklikBolumu" class="section-content">
    <div class="chart-box">
      <!-- Grafik Başlığı ayrı bir kutu olarak düzeltildi ve kapatıldı -->
      <div class="chart-header">
        <div class="chart-title">Sıcaklık Geçmişi</div>
      </div>
      <!-- Grafik Tuvali (Canvas) yarım etiketlerden kurtarıldı ve kendi kutusuna alındı -->
      <div class="chart-container" style="position: relative; height: 220px; width: 100%;">
        <canvas id="sicaklikGrafik"></canvas>
      </div>
    </div>
  </div> <!-- section-content kapatması -->
</div> <!-- section kapatması -->


<div class="section">
  <!-- 1. Başlık Alanı -->
  <div class="section-title" onclick="toggleSection('nemBolumu',this.querySelector('.arrow'))">
    <span>∿ &nbsp; Nem Grafiği (% RH)</span><span class="arrow" id="arrow_nem">▼</span>
  </div>
  
  <!-- 2. İçerik Alanı -->
  <div id="nemBolumu" class="section-content">
    <div class="chart-box">
      <!-- Grafik Başlığı ayrı bir kutu olarak kapatıldı -->
      <div class="chart-header">
        <div class="chart-title">Nem Geçmişi</div>
      </div>
      <!-- Grafik Tuvali (Canvas) başlığın dışına, kendi kutusuna alındı -->
      <div class="chart-container" style="position: relative; height: 220px; width: 100%;">
        <canvas id="nemGrafik"></canvas>
      </div>
    </div>
  </div> <!-- section-content kapatması -->
</div> <!-- section kapatması -->


<div class="section">
<div class="section-title" onclick="toggleSection('olayBolumu',this.querySelector('.arrow'))">
<span>⚙ &nbsp; Olay Kayıtları</span><span class="arrow" id="arrow_olay">▼</span>
</div>
<div id="olayBolumu" class="section-content">
<table class="table">
<thead><tr><th>Zaman</th><th>Seviye</th><th>Kaynak</th><th>Açıklama</th></tr></thead>
<tbody id="olayListesi"></tbody>
</table>
</div>
</div>
</div>

<script>
const firebaseConfig = {
  databaseURL:"https://sunucuodasitakipvesogutma-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

function durumSicaklik(t){
  t=Number(t);
  if(t<15) return {text:"● Düşük Sıcaklık", cls:"low", color:"#3498db"};
  if(t<27) return {text:"● Normal", cls:"normal", color:"#21d89b"};
  if(t<31) return {text:"● Uyarı", cls:"warning", color:"#f1c40f"};
  if(t<36) return {text:"● Yüksek", cls:"critical", color:"#ff5c5c"};
  return {text:"● Kritik", cls:"critical", color:"#ff5c5c"};
}

function uygulaAnlik(data){
  if(!data) return;
  if(data.sicaklik!==undefined){
    const t=Number(data.sicaklik);
    const d=durumSicaklik(t);
    document.getElementById("val_sicaklik").innerHTML=t.toFixed(1)+" <span class='unit'>°C</span>";
    document.getElementById("sub_sicaklik").innerText=d.text;
    document.getElementById("sub_sicaklik").style.color=d.color;
    document.getElementById("bar_sicaklik").style.width=Math.max(0,Math.min(100,t/45*100))+"%";
    document.getElementById("val_alarm").innerHTML='<span class="dot '+d.cls+'"></span><span>'+d.text.replace("● ","")+'</span>';
  }
  if(data.nem!==undefined){
    const n=Number(data.nem);
    document.getElementById("val_nem").innerHTML=n.toFixed(1)+" <span class='unit'>% RH</span>";
    document.getElementById("bar_nem").style.width=Math.max(0,Math.min(100,n))+"%";
  }
  if(data.fan!==undefined){
    const on=data.fan===true || data.fan===1 || String(data.fan).toLowerCase()==="true";
    document.getElementById("val_fan").innerHTML=on
      ? '<span class="dot normal"></span><span>AÇIK</span>'
      : '<span class="dot" style="background:#71849d"></span><span>KAPALI</span>';
  }
}

db.ref("/SistemVerileri").on("value",s=>uygulaAnlik(s.val()));

function cizGrafik(id, veriler, minY, maxY, suffix){
  const canvas=document.getElementById(id);
  if(!canvas)return;

  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth||800;
  const h=canvas.clientHeight||300;

  canvas.width=w*dpr;
  canvas.height=h*dpr;

  const ctx=canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  if(!veriler.length){
    ctx.fillStyle="#71849d";
    ctx.font="14px Segoe UI";
    ctx.fillText("Henüz grafik verisi yok.",20,40);
    return;
  }

  /* Alt tarafı saatlere yer açmak için biraz büyüttük */
  const pad={l:48,r:15,t:20,b:55};
  const pw=w-pad.l-pad.r;
  const ph=h-pad.t-pad.b;

  /* Yatay çizgiler */
  ctx.strokeStyle="#304158";
  ctx.lineWidth=1;

  for(let i=0;i<=5;i++){
    const y=pad.t+ph*i/5;

    ctx.beginPath();
    ctx.moveTo(pad.l,y);
    ctx.lineTo(w-pad.r,y);
    ctx.stroke();

    const v=maxY-(maxY-minY)*i/5;

    ctx.fillStyle="#71849d";
    ctx.font="11px Segoe UI";
    ctx.fillText(v.toFixed(0)+suffix,5,y+4);
  }

  const vals=veriler
    .map(x=>Number(x.v))
    .filter(Number.isFinite);

  const lo=Math.min(minY,Math.min(...vals));
  const hi=Math.max(maxY,Math.max(...vals));
  const range=(hi-lo)||1;

  /* Grafik çizgisi */
  ctx.beginPath();

  veriler.forEach((p,i)=>{
    const x=pad.l+
      (veriler.length===1
        ? pw/2
        : pw*i/(veriler.length-1));

    const y=pad.t+
      ph-
      (Number(p.v)-lo)/range*ph;

    if(i===0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);
  });

  ctx.strokeStyle="#3b8cff";
  ctx.lineWidth=2.5;
  ctx.stroke();

  /* Noktalar */
  veriler.forEach((p,i)=>{
    const x=pad.l+
      (veriler.length===1
        ? pw/2
        : pw*i/(veriler.length-1));

    const y=pad.t+
      ph-
      (Number(p.v)-lo)/range*ph;

    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle="#3b8cff";
    ctx.fill();
  });

  /* =========================
     SAATLER
     ========================= */

  ctx.fillStyle="#71849d";
  ctx.font="11px Segoe UI";
  ctx.textAlign="center";

  /*
     Çok fazla kayıt varsa bütün saatleri
     üst üste yazmamak için en fazla 6 saat gösteriyoruz.
  */
  const maxSaat=6;
  const adim=Math.max(1,Math.ceil(veriler.length/maxSaat));

  veriler.forEach((p,i)=>{

    if(i % adim !== 0 && i !== veriler.length-1)
      return;

    const x=pad.l+
      (veriler.length===1
        ? pw/2
        : pw*i/(veriler.length-1));

    let saat="-";

    if(p.t){
      const tarih=new Date(Number(p.t));

      if(!isNaN(tarih.getTime())){
        saat=tarih.toLocaleTimeString("tr-TR",{
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        });
      }
    }

    ctx.fillText(
      saat,
      x,
      h-18
    );
  });

  ctx.textAlign="left";
}

function gecmisOku(path,canvasId,min,max,suffix){
  db.ref(path).limitToLast(120).on("value",snap=>{
    const arr=[];
    snap.forEach(ch=>{
      const v=ch.val();
      if(v && v.deger!==undefined) arr.push({v:Number(v.deger),t:Number(v.timestamp||Date.now())});
    });
    cizGrafik(canvasId,arr,min,max,suffix);
  });
}

gecmisOku("/SicaklikGecmisi","sicaklikGrafik",10,45,"°C");
gecmisOku("/NemGecmisi","nemGrafik",20,80,"%");

db.ref("/OlayKayitlari").limitToLast(100).on("value",snap=>{
  const tbody=document.getElementById("olayListesi");
  tbody.innerHTML="";
  const logs=[];
  snap.forEach(ch=>{const l=ch.val();if(l)logs.unshift(l);});
  if(!logs.length){
    tbody.innerHTML="<tr><td colspan='4' style='text-align:center;color:#71849d'>Henüz olay kaydı bulunmuyor.</td></tr>";
    return;
  }
  logs.forEach(l=>{
    const tr=document.createElement("tr");
    const ts=l.timestamp?new Date(Number(l.timestamp)).toLocaleString("tr-TR"):(l.zaman||"-");
    const level=l.seviye||"Bilgi";
    const critical=["Kritik","Yüksek","Yetkisiz"].includes(level);
    const warning=["Uyarı"].includes(level);
    const style=critical?"background:#5a2020;color:#ff7373;":warning?"background:#5a4b18;color:#f1c40f;":"background:#18345d;color:#5ea0ff;";
    tr.innerHTML="<td>"+ts+"</td><td><span class='badge' style='"+style+"'>"+level+"</span></td><td>"+(l.kaynak||"-")+"</td><td>"+(l.aciklama||l.mesaj||"-")+"</td>";
    tbody.appendChild(tr);
  });
});

function sifreGuncelle(){
  const input=document.getElementById("yeniSifreMetni");
  const yeni=input.value.trim();
  if(!/^\d{4}$/.test(yeni)){alert("Lütfen 4 haneli sayısal şifre girin.");return;}
  db.ref("/serverguard/aktif_sifre").set(yeni).then(()=>{
    alert("Şifre değiştirildi.");
    input.value="";closeModal();
  }).catch(e=>alert("Şifre kaydedilemedi: "+e.message));
}

function toggleSection(id,arrow){
  const content=document.getElementById(id);
  const open=!content.classList.contains("open");
  content.classList.toggle("open",open);
  arrow.classList.toggle("open",open);
  localStorage.setItem(id,open?"open":"closed");
}

function restoreSections(){
  ["sicaklikBolumu","nemBolumu","olayBolumu"].forEach(id=>{
    const content=document.getElementById(id);
    const arrow=document.getElementById("arrow_"+id.replace("Bolumu",""));
    if(localStorage.getItem(id)==="open"){
      content.classList.add("open");
      if(arrow)arrow.classList.add("open");
    }
  });
}

function openModal(){document.getElementById("sifrePencerem").style.display="block";document.getElementById("modalBackdrop").style.display="block";}
function closeModal(){document.getElementById("sifrePencerem").style.display="none";document.getElementById("modalBackdrop").style.display="none";}

restoreSections();
window.addEventListener("resize",()=>{});
</script>
